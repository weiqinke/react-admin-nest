openapi: 3.0.3
info:
  title: goadmin API
  version: "1.2.0"
  description: |
    goadmin 管理端 HTTP API（GoFrame）。

    **给人读的补充说明**：`docs/API.md`、`docs/FRONTEND.md`  
    **本文件**：机器可读契约，供前端 / 前端 AI / Swagger / 代码生成使用。

    ### 统一响应信封
    所有 JSON 接口均为：`{ "code": number, "message": string, "data": any }`
    - 成功：HTTP 200，`code=0`，`message=ok`，业务在 `data`
    - 失败：`code` 为**业务错误码**（如 40101、40301），HTTP 为映射状态；原因在 `message`，附加在 `data`
    - **本文件各 path 的 200 schema 描述的是 `data` 内容**（与 API.md 一致）；错误响应为完整信封

    ### 常用业务错误码（完整见 API.md §7 / codes.go）
    | code | HTTP | 说明 |
    |------|------|------|
    | 0 | 200 | 成功 |
    | 40001 | 400 | 通用参数错误 |
    | 40002 | 400 | 验证码无效 |
    | 40003 | 400 | 密码密文无效 |
    | 40004 | 400 | 字段校验失败 |
    | 40005 | 400 | 用户名不合法 |
    | 40006 | 400 | 密码不合法 |
    | 40101 | 401 | 未登录 / 账密错误等 |
    | 40102 | 401 | access 无效或已吊销 |
    | 40103 | 401 | refresh 无效或已吊销 |
    | 40104 | 401 | access 过期（预留） |
    | 40301 | 403 | 无权限；data.permission |
    | 40302 | 403 | 账号禁用 |
    | 40401 | 404 | 不存在 |
    | 40901–40906 | 409 | 冲突 / SSD / DSD / 受保护 / 在用 / 用户名已存在 |
    | 42901 | 429 | 限流；data.retry_after + 头 Retry-After |
    | 50001 | 500 | 内部错误 |
    | 50301 | 503 | 依赖不可用 |

    ### 联调要点
    - Base URL 默认 `http://127.0.0.1:8080`
    - 用户 ID 为**雪花字符串**，禁止当成 Number
    - 密码禁止明文：先 `GET /api/crypto/public-key`，RSA-OAEP-SHA256 加密后 Base64 → `password_encrypted`
    - 登录还需验证码；联调可开 `captcha.debug=true`（响应含 `answer`）
    - 登录返回 access(`token`) + `refresh_token`；业务只用 Bearer access；过期用 `POST /api/token/refresh` 旋转续期
    - 登出 `POST /api/logout`（Bearer access，body 建议带 refresh_token）
    - 服务重启后 RSA 公钥会变，需重新拉取
    - 响应头 `X-Request-ID`（可主动传入）

    ### 演示账号
    | 用户 | 密码 | 说明 |
    |------|------|------|
    | admin | admin123 | 权限最全 |
    | user | user123 | 普通用户 |
    | cashier1 | cashier123 | 出纳 |
    | accountant1 | account123 | 会计 |
    | dual1 | dual123 | 登录须传 active_roles |
  contact:
    name: goadmin
servers:
  - url: http://127.0.0.1:8080
    description: 本机开发
tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: Users
  - name: Permissions
  - name: Roles
  - name: RBAC
  - name: LoginLogs
  - name: Stats
  - name: WebSocket

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: 健康检查（含数据库探活）
      security: []
      operationId: getHealth
      responses:
        "200":
          description: 正常
          headers:
            X-Request-ID:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 数据库不可用；完整信封 code=50301，data.status=degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/captcha:
    get:
      tags: [Auth]
      summary: 获取图形验证码（一次性）
      description: |
        再次请求即更换。限流：每 IP 30 次/分钟。
        `captcha.debug=true` 时额外返回 `answer`（仅联调）。
      security: []
      operationId: getCaptcha
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptchaResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/crypto/public-key:
    get:
      tags: [Auth]
      summary: 获取 RSA 公钥
      description: 用于加密登录/注册密码。算法固定 RSA-OAEP-SHA256。
      security: []
      operationId: getPublicKey
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKeyResponse"

  /api/register:
    post:
      tags: [Auth]
      summary: 注册
      description: 成功后自动授予 `user` 角色并创建默认 profile。限流：5 次/分钟/IP。
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 注册成功（需再调 login 取 token）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/login:
    post:
      tags: [Auth]
      summary: 登录
      description: |
        需验证码 + RSA 加密密码。限流：10 次/分钟/IP。
        `active_roles` 可选；不传则尝试激活全部已授角色（可能因 DSD 失败）。
        账号 `profile.status=0` 返回 HTTP 403 / code=40302。
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 账号已禁用（code=40302）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: DSD 冲突等（code=40903）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/token/refresh:
    post:
      tags: [Auth]
      summary: 用 refresh_token 换新的 access + refresh
      description: |
        公开接口。旋转续期：旧 refresh 立即作废，响应中的新 refresh 必须保存。
        限流 30/分钟/IP。refresh 不能当作 Bearer 调业务接口。
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: 新的双 token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: refresh 无效/过期/已吊销（code=40103）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 账号已禁用（code=40302）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: DSD 冲突等（code=40903）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/logout:
    post:
      tags: [Auth]
      summary: 登出（吊销 access；建议同时吊销 refresh）
      operationId: logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: 建议传入，否则 refresh 仍可换新 token
      responses:
        "200":
          description: OK（data）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/me:
    get:
      tags: [Auth]
      summary: 当前登录用户信息
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/me/profile:
    get:
      tags: [Profile]
      summary: 获取自己的用户详情
      operationId: getMyProfile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Profile]
      summary: 更新自己的用户详情
      description: 忽略请求中的 `status` 字段。
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: 更新后的详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/login/logs:
    get:
      tags: [LoginLogs]
      summary: 登录日志列表
      description: 需要权限 `login:read`
      operationId: listLoginLogs
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/fromDate"
        - $ref: "#/components/parameters/toDate"
        - name: username
          in: query
          schema: { type: string }
        - name: user_id
          in: query
          schema: { type: string }
          description: 雪花 ID 字符串
        - name: success
          in: query
          schema: { type: string, enum: ["true", "false", "1", "0"] }
        - name: ip
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginLogListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/login/stats:
    get:
      tags: [LoginLogs]
      summary: 登录统计（图表）
      description: 需要权限 `login:read`。默认最近 7 天，最长 90 天。
      operationId: loginStats
      parameters:
        - $ref: "#/components/parameters/fromDate"
        - $ref: "#/components/parameters/toDate"
        - name: top
          in: query
          schema: { type: integer, default: 10, maximum: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginStatsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/users:
    get:
      tags: [Users]
      summary: 用户列表
      description: 需要权限 `user:read`。每项含 roles 与 profile。
      operationId: listUsers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/users/{id}/profile:
    parameters:
      - $ref: "#/components/parameters/userId"
    get:
      tags: [Users, Profile]
      summary: 查看指定用户详情
      description: 需要权限 `user:read`
      operationId: getUserProfile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users, Profile]
      summary: 管理端更新他人详情
      description: 需要权限 `user:write`；可改 `status`。
      operationId: updateUserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/permissions:
    get:
      tags: [Permissions]
      summary: 权限码列表
      description: 需要权限 `role:read`
      operationId: listPermissions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Permissions]
      summary: 创建权限码
      description: 需要权限 `role:write`
      operationId: createPermission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code:
                  type: string
                  description: 小写字母开头，a-z0-9_:-，长度 2–63
                  example: report:read
                name:
                  type: string
                  example: 查看报表
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/permissions/{code}:
    parameters:
      - $ref: "#/components/parameters/permCode"
    get:
      tags: [Permissions]
      summary: 权限码详情
      description: 需要权限 `role:read`；路径中 `:` 需 URL 编码（如 user%3Aread）
      operationId: getPermission
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Permissions]
      summary: 更新权限名称
      description: 需要权限 `role:write`；code 不可改
      operationId: updatePermission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Permissions]
      summary: 删除权限码
      description: 需要权限 `role:write`；同时清理角色绑定
      operationId: deletePermission
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/roles:
    get:
      tags: [Roles]
      summary: 角色列表
      description: 需要权限 `role:read`；含 inherits、permissions（直接绑定）
      operationId: listRoles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Roles]
      summary: 创建角色
      description: 需要权限 `role:write`
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCreateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/roles/constraints:
    get:
      tags: [RBAC]
      summary: SSD/DSD 约束列表
      description: 需要权限 `role:read`
      operationId: listConstraints
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: "#/components/schemas/Constraint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [RBAC]
      summary: 创建约束
      description: 需要权限 `role:write`
      operationId: createConstraint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConstraintUpsert"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Constraint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/roles/constraints/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string }
        description: 约束 code
    put:
      tags: [RBAC]
      summary: 更新约束
      description: 需要权限 `role:write`
      operationId: updateConstraint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConstraintUpsert"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Constraint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [RBAC]
      summary: 删除约束
      description: 需要权限 `role:write`
      operationId: deleteConstraint
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/roles/{code}:
    parameters:
      - $ref: "#/components/parameters/roleCode"
    get:
      tags: [Roles]
      summary: 角色详情
      description: 需要权限 `role:read`
      operationId: getRole
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Roles]
      summary: 更新角色
      description: 需要权限 `role:write`；`inherits` 传数组则整表替换
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Roles]
      summary: 删除角色
      description: 需要权限 `role:write`；禁止删 admin；仍有用户绑定时拒绝
      operationId: deleteRole
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/roles/{code}/permissions:
    parameters:
      - $ref: "#/components/parameters/roleCode"
    get:
      tags: [Roles]
      summary: 角色直接绑定的权限
      description: 需要权限 `role:read`；不含继承展开
      operationId: listRolePermissions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items: { type: string }
                  permissions:
                    type: array
                    items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Roles]
      summary: 追加权限到角色
      description: 需要权限 `role:write`
      operationId: grantRolePermissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionGrantRequest"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Roles]
      summary: 全量替换角色权限
      description: 需要权限 `role:write`
      operationId: setRolePermissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_codes]
              properties:
                permission_codes:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/roles/{code}/permissions/{perm}:
    delete:
      tags: [Roles]
      summary: 解绑单个权限
      description: 需要权限 `role:write`；`perm` 含 `:` 时需 URL 编码
      operationId: revokeRolePermission
      parameters:
        - $ref: "#/components/parameters/roleCode"
        - name: perm
          in: path
          required: true
          schema: { type: string }
          description: 权限码，如 user:read → user%3Aread
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/rbac/assign:
    post:
      tags: [RBAC]
      summary: 给用户授予角色
      description: 需要权限 `role:write`；违反 SSD 返回 409
      operationId: assignRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RbacUserRoleRequest"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/rbac/revoke:
    post:
      tags: [RBAC]
      summary: 撤销用户角色
      description: 需要权限 `role:write`
      operationId: revokeRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RbacUserRoleRequest"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/stats/access:
    get:
      tags: [Stats]
      summary: 按 method+path 汇总访问量
      description: 需要权限 `stats:read`
      operationId: statsAccessByPath
      parameters:
        - $ref: "#/components/parameters/fromDate"
        - $ref: "#/components/parameters/toDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/stats/access/logs:
    get:
      tags: [Stats]
      summary: 访问日志明细
      description: 需要权限 `stats:read`
      operationId: statsAccessLogs
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/fromDate"
        - $ref: "#/components/parameters/toDate"
        - name: user_id
          in: query
          schema: { type: string }
          description: 雪花 ID；传 anonymous 只查匿名
        - name: path
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessLogListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/stats/access/daily:
    get:
      tags: [Stats]
      summary: 按天访问统计
      description: 需要权限 `stats:read`
      operationId: statsAccessDaily
      parameters:
        - $ref: "#/components/parameters/fromDate"
        - $ref: "#/components/parameters/toDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/stats/access/users:
    get:
      tags: [Stats]
      summary: 按用户访问统计
      description: 需要权限 `stats:read`
      operationId: statsAccessByUser
      parameters:
        - $ref: "#/components/parameters/fromDate"
        - $ref: "#/components/parameters/toDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/stats/server:
    get:
      tags: [Stats]
      summary: 本机与本进程运行指标
      description: |
        需要权限 `stats:read`。含 host/cpu/memory/swap/disks/network/load/process/runtime。
      operationId: statsServer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /gows:
    get:
      tags: [WebSocket]
      summary: WebSocket 连接
      description: |
        需要权限 `ws:connect`。
        连接：`ws://host/gows?token=<jwt>` 或 Header Bearer。
        连接后收到 welcome；可发 `{"type":"chat","payload":{"text":"hi"}}` 广播。
      operationId: websocketConnect
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
          description: JWT（也可用 Authorization Bearer）
      responses:
        "101":
          description: Switching Protocols（WebSocket）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录后获得的 **access** JWT（不要用 refresh）。Header: Authorization: Bearer <token>

  parameters:
    page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    pageSize:
      name: page_size
      in: query
      schema: { type: integer, default: 20, maximum: 200 }
    fromDate:
      name: from
      in: query
      schema: { type: string, format: date }
      description: YYYY-MM-DD
    toDate:
      name: to
      in: query
      schema: { type: string, format: date }
      description: YYYY-MM-DD
    userId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: 用户雪花 ID（字符串）
      example: "373365163937501184"
    roleCode:
      name: code
      in: path
      required: true
      schema: { type: string }
      example: manager
    permCode:
      name: code
      in: path
      required: true
      schema: { type: string }
      description: 权限码；含冒号时 URL 编码，如 user%3Aread
      example: user%3Aread

  responses:
    BadRequest:
      description: 参数错误（业务码 40001–40006 等）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未登录或 token 无效/已吊销（40101–40104）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 无权限或账号禁用（40301 / 40302）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenError"
    NotFound:
      description: 资源不存在（40401）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 冲突（40901–40906：已存在 / SSD/DSD / 受保护 / 在用等）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: 限流（42901）
      headers:
        Retry-After:
          schema: { type: integer }
          description: 建议等待秒数
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitError"

  schemas:
    Envelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          description: |
            0=成功；非 0 为业务错误码（如 40101），**不等于** HTTP 状态码。
            完整表见 API.md §7 / internal/pkg/response/codes.go
          example: 0
        message:
          type: string
          example: ok
        data:
          description: 成功为业务体；失败可为 null 或附加字段（permission / retry_after 等）
          nullable: true

    Error:
      allOf:
        - $ref: "#/components/schemas/Envelope"
      example:
        code: 40002
        message: invalid captcha
        data: null

    ForbiddenError:
      allOf:
        - $ref: "#/components/schemas/Envelope"
      example:
        code: 40301
        message: forbidden
        data:
          permission: user:read

    RateLimitError:
      allOf:
        - $ref: "#/components/schemas/Envelope"
      example:
        code: 42901
        message: too many requests
        data:
          retry_after: 12

    StatusOk:
      type: object
      properties:
        status: { type: string, example: ok }

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        rbac:
          type: string
          example: constrained
        checks:
          type: object
          properties:
            database:
              type: object
              properties:
                ok: { type: boolean }
                error: { type: string }

    CaptchaResponse:
      type: object
      required: [captcha_id, image]
      properties:
        captcha_id: { type: string }
        image:
          type: string
          description: data:image/png;base64,...
        answer:
          type: string
          description: 仅 captcha.debug=true 时返回

    PublicKeyResponse:
      type: object
      properties:
        key_id: { type: string, example: rsa-2048 }
        algorithm: { type: string, example: RSA-OAEP-SHA256 }
        public_key:
          type: string
          description: PEM 格式公钥

    RegisterRequest:
      type: object
      required: [username, password_encrypted]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_]+$'
        password_encrypted:
          type: string
          description: Base64(RSA-OAEP-SHA256(明文密码))

    RegisterResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserBrief"

    LoginRequest:
      type: object
      required: [username, password_encrypted, captcha_id, captcha_code]
      properties:
        username: { type: string }
        password_encrypted:
          type: string
          description: Base64(RSA-OAEP-SHA256(明文密码))；禁止明文 password 字段
        captcha_id: { type: string }
        captcha_code: { type: string }
        active_roles:
          type: array
          items: { type: string }
          description: 可选；本次会话激活角色（DSD）

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: access JWT（Bearer）
        expires_at:
          type: string
          description: access 过期时间（HTTP-date）
        refresh_token:
          type: string
          description: refresh JWT；仅用于 /api/token/refresh
        refresh_expires_at:
          type: string
          description: refresh 过期时间（HTTP-date）
        user:
          $ref: "#/components/schemas/MeResponse"

    MeResponse:
      type: object
      properties:
        id:
          type: string
          description: 雪花 ID 字符串
        username: { type: string }
        roles:
          type: array
          items: { type: string }
        active_roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        profile:
          $ref: "#/components/schemas/Profile"

    UserBrief:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        roles:
          type: array
          items: { type: string }
        profile:
          $ref: "#/components/schemas/Profile"

    UserListItem:
      allOf:
        - $ref: "#/components/schemas/UserBrief"
        - type: object
          properties:
            created_at: { type: string }

    Profile:
      type: object
      properties:
        user_id: { type: string }
        nickname: { type: string }
        real_name: { type: string }
        avatar: { type: string }
        gender:
          type: integer
          description: 0未知 1男 2女 3其他
        birthday:
          type: string
          description: YYYY-MM-DD，可空
        email: { type: string }
        phone: { type: string }
        mobile: { type: string }
        id_card: { type: string }
        employee_no: { type: string }
        department: { type: string }
        job_title: { type: string }
        company: { type: string }
        province: { type: string }
        city: { type: string }
        district: { type: string }
        address: { type: string }
        postal_code: { type: string }
        country: { type: string }
        bio: { type: string }
        website: { type: string }
        wechat: { type: string }
        qq: { type: string }
        status:
          type: integer
          description: 1正常 0禁用
        remark: { type: string }
        extra_json: { type: string }
        created_at: { type: string }
        updated_at: { type: string }

    ProfileUpdate:
      type: object
      description: 所有字段可选；只更新传入字段
      properties:
        nickname: { type: string }
        real_name: { type: string }
        avatar: { type: string }
        gender: { type: integer }
        birthday: { type: string }
        email: { type: string }
        phone: { type: string }
        mobile: { type: string }
        id_card: { type: string }
        employee_no: { type: string }
        department: { type: string }
        job_title: { type: string }
        company: { type: string }
        province: { type: string }
        city: { type: string }
        district: { type: string }
        address: { type: string }
        postal_code: { type: string }
        country: { type: string }
        bio: { type: string }
        website: { type: string }
        wechat: { type: string }
        qq: { type: string }
        status:
          type: integer
          description: 仅管理端更新他人时可改；本人 PUT /api/me/profile 会忽略
        remark: { type: string }
        extra_json: { type: string }

    Permission:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        created_at: { type: string }

    Role:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        inherits:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
          description: 直接绑定，不含继承展开
        created_at: { type: string }

    RoleCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        inherits:
          type: array
          items: { type: string }

    RoleUpdateRequest:
      type: object
      properties:
        name: { type: string }
        inherits:
          type: array
          items: { type: string }
          description: 传数组则整表替换继承关系

    PermissionGrantRequest:
      type: object
      properties:
        permission_code: { type: string }
        permission_codes:
          type: array
          items: { type: string }

    Constraint:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [ssd, dsd]
        max_roles: { type: integer }
        roles:
          type: array
          items: { type: string }
        created_at: { type: string }

    ConstraintUpsert:
      type: object
      required: [code, name, type, roles]
      properties:
        code: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [ssd, dsd]
        max_roles:
          type: integer
          minimum: 0
          default: 1
        roles:
          type: array
          minItems: 2
          items: { type: string }

    RbacUserRoleRequest:
      type: object
      required: [user_id, role_code]
      properties:
        user_id:
          type: string
          description: 雪花 ID 字符串
        role_code: { type: string }

    LoginLogListResponse:
      type: object
      properties:
        list:
          type: array
          items:
            type: object
            additionalProperties: true
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }

    LoginStatsResponse:
      type: object
      properties:
        from: { type: string }
        to: { type: string }
        summary:
          type: object
          additionalProperties: true
        daily:
          type: array
          items:
            type: object
            additionalProperties: true
        by_user:
          type: array
          items:
            type: object
            additionalProperties: true

    AccessLogListResponse:
      type: object
      properties:
        list:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              method: { type: string }
              path: { type: string }
              url: { type: string }
              ip: { type: string }
              user_id: { type: string }
              username: { type: string }
              anonymous: { type: boolean }
              status: { type: integer }
              created_at: { type: string }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
